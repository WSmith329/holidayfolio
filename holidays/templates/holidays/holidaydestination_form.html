{% extends "base.html" %}

{% block content %}
    {% if object %}
        <p>Destination: {{ object.destination.name }} <a href="{% url 'destination-update' pk=object.destination.id %}?next={{ request.path }}">Edit</a></p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">{% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Save">
    </form>
{% endblock %}
