{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}Holidayfolio{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
        <script src="https://kit.fontawesome.com/f2fedb9211.js" crossorigin="anonymous"></script>
    </head>

    <body class="page-grid">
        {% block header %}
        <header>
            <div><a class="nav-link" href="{% url 'holiday-create' %}"><i class="fa-solid fa-plane-departure"></i></a></div>
            <div><a class="nav-link" href="{% url 'holiday-list' %}">Holidayfolio</a></div>
            <div>
                {% if user.is_authenticated %}
                    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-link" type="submit" value="Logout"><i class="fa-solid fa-right-from-bracket"></i></button></form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}"><i class="fa-solid fa-right-to-bracket"></i></a>
                {% endif %}
            </div>
        </header>
        {% endblock header %}
        <main>{% block content %}{% endblock content %}</main>
    </body>
</html>
