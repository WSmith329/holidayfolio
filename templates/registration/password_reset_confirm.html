<!-- password_reset_confirm.html -->
{% extends "base.html" %}
{% block content %}
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Set new password</button>
</form>
{% else %}
<p>This password reset link is invalid, possibly because it's already been used.</p>
{% endif %}
{% endblock %}
